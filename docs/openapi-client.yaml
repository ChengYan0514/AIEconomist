openapi: 3.1.0
info:
  title: AI Economist 客户端 API
  version: 0.1.0
  description: |
    AI Economist 客户端科研工作台 HTTP 契约，与管理端共用会话与 CSRF 机制（详见 docs/openapi.yaml）。
    所有 /api/client/** 接口要求已登录的平台用户会话且持有 CLIENT_ACCESS 权限。
    写请求（POST、PATCH、DELETE）须先调用 GET /api/csrf 并在对应请求头中附带 CSRF token。
    任务数据严格按当前登录平台用户隔离，访问他人或不存在的任务统一返回 404 CITATION_TASK_NOT_FOUND。
    错误响应统一采用管理端 Error 结构 {code, message}。
servers:
  - url: /api/client
security:
  - session: []
paths:
  /modules:
    get:
      operationId: listClientModules
      description: 返回客户端一级科研模块目录及当前后端能力接入状态，供前端导航与状态提示使用。
      responses:
        '200':
          description: 模块目录
          content:
            application/json:
              schema:
                type: object
                required: [modules]
                properties:
                  modules:
                    type: array
                    items: {$ref: '#/components/schemas/ClientModule'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /journals:
    get:
      operationId: listClientJournals
      description: |
        查询本地论文库（v2_paper_read，排除已归档）已覆盖的期刊目录，名称关联 OpenAlex 快照 sources 表解析。
        供客户端检索范围筛选共用，按已发布全文篇数降序、总篇数降序、期刊名升序返回。
      parameters:
        - name: q
          in: query
          description: 可选关键词，忽略大小写匹配期刊名或 OpenAlex sourceId
          schema: {type: string, maxLength: 200}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200':
          description: 本地期刊目录
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ClientJournal'}
                  total: {type: integer, format: int64, minimum: 0}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /citations/tasks:
    get:
      operationId: listCitationTasks
      description: 分页查询当前登录用户的引文标注任务历史，按 createdAt 倒序排列。
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/CitationTaskStatus'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: 当前用户的任务历史分页
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/CitationTaskSummary'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      operationId: createCitationTask
      description: |
        提交一个新的引文标注任务并异步派发至当前配置的 CitationEngine。
        若用户活跃（QUEUED/RUNNING）任务数达到上限返回 409 CITATION_CONFLICT；
        若当前引擎未启用或不可用返回 503 CITATION_ENGINE_UNAVAILABLE。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCitationTaskRequest'}
      responses:
        '202':
          description: 任务已受理，返回初始快照
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CitationTaskDetail'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error', description: CITATION_CONFLICT}
        '503': {$ref: '#/components/responses/Error', description: CITATION_ENGINE_UNAVAILABLE}

  /citations/tasks/{taskId}:
    parameters:
      - {$ref: '#/components/parameters/TaskId'}
    get:
      operationId: getCitationTask
      description: 获取当前用户的单条引文标注任务完整详情（含引文陈述、已补全的候选文献、已选文献、统计与事件历史）。
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CitationTaskDetail'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error', description: CITATION_TASK_NOT_FOUND}
    delete:
      operationId: deleteCitationTask
      description: 删除当前用户的一条已终态引文标注任务。运行中任务须先取消，否则返回 409 CITATION_TASK_ACTIVE。
      responses:
        '204': {description: 任务已删除}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error', description: CITATION_TASK_NOT_FOUND}
        '409': {$ref: '#/components/responses/Error', description: CITATION_TASK_ACTIVE}

  /citations/tasks/{taskId}/events:
    parameters:
      - {$ref: '#/components/parameters/TaskId'}
    get:
      operationId: streamCitationTaskEvents
      description: |
        建立 SSE 事件流，先重放该任务已持久化的进度事件，再实时推送后续阶段更新。
        事件名：
        - `progress`：data 为 CitationProgressEvent JSON
        - `complete`：任务达到终态（SUCCEEDED/FAILED/CANCELLED）时发送一次摘要 JSON 后关闭连接
      responses:
        '200':
          description: text/event-stream 实时进度流
          content:
            text/event-stream:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error', description: CITATION_TASK_NOT_FOUND}

  /citations/tasks/{taskId}/cancel:
    parameters:
      - {$ref: '#/components/parameters/TaskId'}
    post:
      operationId: cancelCitationTask
      description: 取消排队中或运行中的引文标注任务，并尽力通知下游引擎中止。终态任务返回 409 CITATION_TASK_TERMINAL。
      responses:
        '200':
          description: 取消后的任务快照
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CitationTaskDetail'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error', description: CITATION_TASK_NOT_FOUND}
        '409': {$ref: '#/components/responses/Error', description: CITATION_TASK_TERMINAL}

  /citations/tasks/{taskId}/review:
    parameters:
      - {$ref: '#/components/parameters/TaskId'}
    patch:
      operationId: updateCitationReview
      description: |
        在任务完成后由用户人工审阅调整各引文陈述采纳的参考文献，或切换引文样式。
        Java 宿主在服务端基于本地补全后的结构化元数据确定性重排 annotatedText 与 bibliography 并持久化，不重调外部 AI 引擎。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateCitationReviewRequest'}
      responses:
        '200':
          description: 重排并持久化后的完整任务详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CitationTaskDetail'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error', description: CITATION_TASK_NOT_FOUND}
        '409': {$ref: '#/components/responses/Error', description: CITATION_TASK_NOT_READY}

  /citations/tasks/{taskId}/export:
    parameters:
      - {$ref: '#/components/parameters/TaskId'}
      - name: format
        in: query
        required: true
        schema: {type: string, enum: [txt, md, bibtex]}
      - name: style
        in: query
        description: 可选临时覆盖导出的引文样式，不修改已保存任务样式
        schema: {$ref: '#/components/schemas/CitationStyle'}
    get:
      operationId: exportCitationTask
      description: 导出已完成引文标注任务的带引文正文与参考文献列表（纯文本、Markdown 或 BibTeX）。
      responses:
        '200':
          description: 导出文件附件
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            text/plain:
              schema: {type: string}
            text/markdown:
              schema: {type: string}
            application/x-bibtex:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error', description: CITATION_TASK_NOT_FOUND}
        '409': {$ref: '#/components/responses/Error', description: CITATION_TASK_NOT_READY}

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: PAPERFLOW_SESSION
  parameters:
    TaskId: {name: taskId, in: path, required: true, schema: {type: string, format: uuid}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
    Size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
  responses:
    Error:
      description: 统一错误响应
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: {type: string}
              message: {type: string}
  schemas:
    Page:
      type: object
      required: [items, page, size, total]
      properties:
        items: {type: array}
        page: {type: integer}
        size: {type: integer}
        total: {type: integer, format: int64}

    ClientModuleId:
      type: string
      enum: [citations, qa, writing]

    ClientModuleStatus:
      type: string
      enum: [AVAILABLE, STUB, COMING_SOON, UNAVAILABLE]

    ClientModule:
      type: object
      required: [id, name, description, status, provider, message]
      properties:
        id: {$ref: '#/components/schemas/ClientModuleId'}
        name: {type: string}
        description: {type: string}
        status: {$ref: '#/components/schemas/ClientModuleStatus'}
        provider: {type: [string, 'null'], description: 当前接入的能力引擎标识，例如 stub、citations-retrieval-v1、standard-v1}
        message: {type: [string, 'null'], description: 固定的安全状态说明，不包含底层 URL 或密钥}

    ClientJournal:
      type: object
      required: [sourceId, name, paperCount, publishedCount, yearMin, yearMax]
      properties:
        sourceId: {type: string}
        name: {type: string}
        paperCount: {type: integer, format: int64, minimum: 0}
        publishedCount: {type: integer, format: int64, minimum: 0}
        yearMin: {type: [integer, 'null']}
        yearMax: {type: [integer, 'null']}

    CitationStyle:
      type: string
      enum: [apa, ieee, chicago-author-date, mla]

    CitationTaskStatus:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]

    CitationStage:
      type: string
      enum: [QUEUED, PARSE_TEXT, PLAN_RETRIEVAL, RETRIEVE_REFERENCES, RANK_EVIDENCE, ENRICH_METADATA, FORMAT_OUTPUT, COMPLETED, FAILED, CANCELLED]

    RetrievalPolicy:
      type: object
      additionalProperties: false
      properties:
        sourceIds:
          type: [array, 'null']
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 64}
          description: OpenAlex 出版来源 ID 白名单；省略或为空表示不限制期刊
        yearMin: {type: [integer, 'null'], minimum: 1000, maximum: 9999}
        yearMax: {type: [integer, 'null'], minimum: 1000, maximum: 9999}

    CreateCitationTaskRequest:
      type: object
      additionalProperties: false
      required: [text, citationStyle]
      properties:
        title: {type: [string, 'null'], maxLength: 160, description: 可选任务标题；留空时由正文首句自动截取}
        text: {type: string, minLength: 1, maxLength: 20000}
        citationStyle: {$ref: '#/components/schemas/CitationStyle'}
        retrievalPolicy: {$ref: '#/components/schemas/RetrievalPolicy'}

    UpdateCitationReviewRequest:
      type: object
      additionalProperties: false
      properties:
        citationStyle: {$ref: '#/components/schemas/CitationStyle'}
        selectedReferenceIds:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
          description: 键为 statementId，值为用户最终采纳的有序 referenceId 列表（允许空数组表示该陈述暂不插入引文）

    CitationStatement:
      type: object
      required: [statementId, text, startChar, endChar, needsCitation, query, confidence]
      properties:
        statementId: {type: string}
        text: {type: string}
        startChar: {type: integer, minimum: 0}
        endChar: {type: integer, minimum: 0}
        needsCitation: {type: boolean}
        query: {type: [string, 'null']}
        confidence: {type: [number, 'null'], minimum: 0, maximum: 1}

    EvidenceChunk:
      type: object
      required: [chunkId, sectionTitle, text, retrievalScore, supportScore, confidence, reason]
      properties:
        chunkId: {type: string}
        sectionTitle: {type: [string, 'null']}
        text: {type: string}
        retrievalScore: {type: [number, 'null']}
        supportScore: {type: [number, 'null']}
        confidence: {type: [number, 'null']}
        reason: {type: [string, 'null']}

    CitationReference:
      type: object
      required: [referenceId, workId, paperId, doi, title, authors, year, venue, sourceId, url, metadataSource, rankScore, maxSupportScore, maxConfidence, chunks]
      properties:
        referenceId: {type: string}
        workId: {type: [string, 'null'], description: OpenAlex 作品 ID}
        paperId: {type: [string, 'null'], description: 已关联的本地论文 ID（如有）}
        doi: {type: [string, 'null']}
        title: {type: string}
        authors: {type: array, items: {type: string}}
        year: {type: [integer, 'null']}
        venue: {type: [string, 'null']}
        sourceId: {type: [string, 'null']}
        url: {type: [string, 'null']}
        metadataSource: {type: string, enum: [LOCAL_DB, ENGINE, LOCAL_DB_AND_ENGINE]}
        rankScore: {type: [number, 'null']}
        maxSupportScore: {type: [number, 'null']}
        maxConfidence: {type: [number, 'null']}
        chunks:
          type: array
          items: {$ref: '#/components/schemas/EvidenceChunk'}

    EvidenceStats:
      type: object
      required: [judgedChunks, supportedChunks, supportedReferences, rejected, hitHardRecallLimit, hitHardJudgmentLimit]
      properties:
        judgedChunks: {type: integer, minimum: 0}
        supportedChunks: {type: integer, minimum: 0}
        supportedReferences: {type: integer, minimum: 0}
        rejected:
          type: object
          required: [partial, contradicts, irrelevant, lowScore, lowConfidence]
          properties:
            partial: {type: integer, minimum: 0}
            contradicts: {type: integer, minimum: 0}
            irrelevant: {type: integer, minimum: 0}
            lowScore: {type: integer, minimum: 0}
            lowConfidence: {type: integer, minimum: 0}
        hitHardRecallLimit: {type: boolean}
        hitHardJudgmentLimit: {type: boolean}

    CitationProgressEvent:
      type: object
      required: [eventId, stage, eventType, progress, message, payload, occurredAt]
      properties:
        eventId: {type: integer, format: int64}
        stage: {$ref: '#/components/schemas/CitationStage'}
        eventType: {type: string, enum: [STATUS_CHANGED, STAGE_STARTED, STAGE_COMPLETED, WARNING, COMPLETED, FAILED, CANCELLED]}
        progress: {type: number, minimum: 0, maximum: 1}
        message: {type: string}
        payload: {type: object}
        occurredAt: {type: string, format: date-time}

    CitationTaskSummary:
      type: object
      required: [taskId, title, status, stage, progress, citationStyle, engineProvider, statementCount, selectedReferenceCount, createdAt, updatedAt, finishedAt, errorMessage]
      properties:
        taskId: {type: string, format: uuid}
        title: {type: string}
        status: {$ref: '#/components/schemas/CitationTaskStatus'}
        stage: {$ref: '#/components/schemas/CitationStage'}
        progress: {type: number, minimum: 0, maximum: 1}
        citationStyle: {$ref: '#/components/schemas/CitationStyle'}
        engineProvider: {type: string}
        statementCount: {type: integer, minimum: 0}
        selectedReferenceCount: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        errorMessage: {type: [string, 'null']}

    CitationTaskDetail:
      allOf:
        - {$ref: '#/components/schemas/CitationTaskSummary'}
        - type: object
          required: [originalText, retrievalPolicy, statements, referencesByStatement, selectedReferenceIds, evidenceStats, annotatedText, bibliography, warnings, errorCode, events]
          properties:
            originalText: {type: string}
            retrievalPolicy:
              type: object
              required: [sourceIds, yearMin, yearMax]
              properties:
                sourceIds: {type: array, items: {type: string}}
                yearMin: {type: [integer, 'null']}
                yearMax: {type: [integer, 'null']}
            statements:
              type: array
              items: {$ref: '#/components/schemas/CitationStatement'}
            referencesByStatement:
              type: object
              additionalProperties:
                type: array
                items: {$ref: '#/components/schemas/CitationReference'}
            selectedReferenceIds:
              type: object
              additionalProperties:
                type: array
                items: {type: string}
            evidenceStats:
              type: object
              additionalProperties: {$ref: '#/components/schemas/EvidenceStats'}
            annotatedText: {type: [string, 'null']}
            bibliography: {type: [string, 'null']}
            warnings: {type: array, items: {type: string}}
            errorCode: {type: [string, 'null']}
            events:
              type: array
              items: {$ref: '#/components/schemas/CitationProgressEvent'}
