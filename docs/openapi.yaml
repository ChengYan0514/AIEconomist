openapi: 3.1.0
info:
  title: AI Economist 管理 API
  version: 0.1.0
  description: |
    写请求需要 CSRF。先在同一会话中请求 GET /csrf，再将 token 送入 headerName 指定的请求头。
    此规则也适用于登录。保存登录响应更新的 PAPERFLOW_SESSION Cookie。
    受保护的请求在会话无效时可返回 401 AUTH_REQUIRED，CSRF 校验失败时返回 403 ACCESS_DENIED。
    业务请求按当前账号的权限授权，权限不足返回 403 ACCESS_DENIED。
    临时密码会话只允许获取 CSRF、检查会话、改密和退出，其他业务请求返回 403 PASSWORD_CHANGE_REQUIRED。
    应用错误使用统一的 Error 响应结构。异步执行结果另见任务项。
servers:
  - url: /api
security:
  - session: []
paths:
  /csrf:
    get:
      operationId: csrfToken
      security: []
      responses:
        '200':
          description: POST、PUT、PATCH、DELETE 请求使用返回的 headerName 和 token
          content:
            application/json:
              schema:
                type: object
                required: [headerName, token]
                properties:
                  headerName: {type: string}
                  token: {type: string}
  /session:
    get:
      operationId: currentSession
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Error'}
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    delete:
      operationId: logout
      responses:
        '204': {description: 会话已退出}
  /session/password:
    post:
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: {type: string, format: password}
                newPassword: {type: string, format: password, minLength: 12, description: UTF-8 编码长度最多 72 字节}
      responses:
        '204': {description: 密码已更新并撤销使用旧凭据建立的会话}
        '400': {$ref: '#/components/responses/Error'}
  /users:
    get:
      operationId: listUsers
      description: 需要 SYSTEM_MANAGE。搜索同时匹配用户名和显示名称，忽略大小写。用户名升序。
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
        - {name: role, in: query, schema: {$ref: '#/components/schemas/UserRole'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/UserStatus'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: 平台用户分页
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/PlatformUser'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      operationId: createUser
      description: 需要 SYSTEM_MANAGE。用户名去除首尾空白并转为小写，创建后保持固定。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/UserProfile'}
                - type: object
                  required: [username]
                  properties:
                    username: {type: string, description: '规范化后符合 ^[a-z0-9_.-]{3,50}$'}
      responses:
        '201':
          description: 新用户及仅在本次响应中展示的临时密码
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                required: [user, temporaryPassword]
                properties:
                  user: {$ref: '#/components/schemas/PlatformUser'}
                  temporaryPassword: {type: string, format: password, readOnly: true}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error', description: USERNAME_TAKEN}
  /users/{username}:
    patch:
      operationId: updateUser
      description: 需要 SYSTEM_MANAGE。提交显示名称及单个角色，后续请求立即采用新角色。
      parameters:
        - {name: username, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserProfile'}
      responses:
        '200':
          description: 已更新的平台用户
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformUser'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error', description: LAST_SYSTEM_ADMIN}
  /papers:
    get:
      operationId: listPapers
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: sourceId, in: query, schema: {type: string}}
        - {name: yearFrom, in: query, schema: {type: integer, minimum: 1000, maximum: 9999}}
        - {name: yearTo, in: query, schema: {type: integer, minimum: 1000, maximum: 9999}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/PaperStatus'}}
        - {name: archived, in: query, schema: {type: boolean, default: false}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: 论文分页，最近编辑在前
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/Paper'}
        '400': {$ref: '#/components/responses/Error'}
    post:
      operationId: uploadPaper
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - {$ref: '#/components/schemas/Metadata'}
                - type: object
                  required: [file]
                  properties: {file: {type: string, format: binary, description: PDF，单个原件上限 100 MiB}}
      responses:
        '201': {$ref: '#/components/responses/Paper'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
  /papers/export:
    parameters:
      - {name: q, in: query, schema: {type: string, maxLength: 200}}
      - {name: sourceId, in: query, schema: {type: string}}
      - {name: yearFrom, in: query, schema: {type: integer, minimum: 1000, maximum: 9999}}
      - {name: yearTo, in: query, schema: {type: integer, minimum: 1000, maximum: 9999}}
      - {name: status, in: query, schema: {$ref: '#/components/schemas/PaperStatus'}}
      - {name: archived, in: query, schema: {type: boolean, default: false}}
    get:
      operationId: exportPapers
      description: 需要 PAPER_CSV_EXPORT。服务器完成 CSV 写入和刷新后记录成功事件。已登录的无效请求和导出异常记录为失败，权限不足的请求记录为拒绝。
      responses:
        '200':
          description: 导出全部命中行的 UTF-8 CSV
          content:
            text/csv:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    head:
      operationId: getPaperExportHeaders
      description: 需要 PAPER_CSV_EXPORT。检查导出响应头。
      responses:
        '200': {description: CSV 响应头}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /audit-events:
    get:
      operationId: listAuditEvents
      description: 仅系统管理员可用。所有条件同时匹配，时间边界包含在内，结果按时间及事件 ID 倒序。
      parameters:
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: actor, in: query, schema: {type: string, maxLength: 50}}
        - {name: action, in: query, schema: {type: string, maxLength: 64}}
        - {name: objectType, in: query, schema: {type: string, maxLength: 64}}
        - {name: objectId, in: query, schema: {type: string, maxLength: 255}}
        - {name: outcome, in: query, schema: {$ref: '#/components/schemas/AuditOutcome'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: 审计事件分页，标识筛选采用精确匹配
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/AuditEvent'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /audit-events/{eventId}:
    get:
      operationId: getAuditEvent
      description: 仅系统管理员可用。
      parameters:
        - {name: eventId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: 审计事件详情
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/AuditEvent'}
                  - required: [summary]
                    properties:
                      summary:
                        type: object
                        description: 按动作提供有限摘要。CSV 成功事件仅包括导出行数、是否使用搜索、来源 ID、年份范围、处理状态及归档视图。失败事件仅保留错误代码。
                        additionalProperties: {type: [string, integer, boolean]}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /papers/{paperId}:
    parameters: [{$ref: '#/components/parameters/PaperId'}]
    get:
      operationId: getPaper
      responses:
        '200': {$ref: '#/components/responses/Paper'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      operationId: editPaper
      description: 提交完整书目字段。省略可选书目字段会清除原值。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/Metadata'}
                - type: object
                  required: [version]
                  properties: {version: {type: integer, format: int64}}
      responses:
        '200': {$ref: '#/components/responses/Paper'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /papers/{paperId}/archive:
    parameters: [{$ref: '#/components/parameters/PaperId'}, {$ref: '#/components/parameters/Version'}]
    post:
      operationId: archivePaper
      responses:
        '200': {$ref: '#/components/responses/Paper'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      operationId: restorePaper
      responses:
        '200': {$ref: '#/components/responses/Paper'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /papers/{paperId}/file:
    parameters: [{$ref: '#/components/parameters/PaperId'}]
    get:
      operationId: originalFile
      responses:
        '200':
          description: PDF 在线预览，其余原件类型作为附件返回
          content:
            application/pdf:
              schema: {type: string, format: binary}
            application/octet-stream:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/Error'}
    put:
      operationId: replaceOriginal
      parameters: [{$ref: '#/components/parameters/Version'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: {file: {type: string, format: binary, description: PDF，单个原件上限 100 MiB}}
      responses:
        '200': {$ref: '#/components/responses/Paper'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
  /papers/{paperId}/blocks:
    parameters: [{$ref: '#/components/parameters/PaperId'}]
    get:
      operationId: listBlocks
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}]
      responses:
        '200':
          description: 当前已发布全文，块按文档顺序排列
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/Block'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /papers/{paperId}/blocks/{sequence}/asset:
    parameters:
      - {$ref: '#/components/parameters/PaperId'}
      - {name: sequence, in: path, required: true, schema: {type: integer, minimum: 0}}
    get:
      operationId: blockAsset
      responses:
        '200':
          description: 当前全文块登记的图片
          content:
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
            image/gif:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /papers/{paperId}/match:
    parameters: [{$ref: '#/components/parameters/PaperId'}]
    post:
      operationId: confirmMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workId, version]
              properties:
                workId: {type: string}
                version: {type: integer, format: int64}
      responses:
        '200': {$ref: '#/components/responses/Paper'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /sources:
    get:
      operationId: searchSources
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
      responses:
        '200':
          description: 最多 25 个来自 OpenAlex 快照的出版来源
          content:
            application/json:
              schema:
                type: array
                maxItems: 25
                items:
                  type: object
                  required: [sourceId, name]
                  properties:
                    sourceId: {type: string}
                    name: {type: string}
        '400': {$ref: '#/components/responses/Error'}
  /imports:
    post:
      operationId: preflightOriginals
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: {file: {type: string, format: binary, description: ZIP，上限 256 MiB}}
      responses:
        '201': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
  /imports/{jobId}/confirm:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      operationId: confirmOriginals
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /jobs:
    get:
      operationId: listJobs
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {name: kind, in: query, schema: {$ref: '#/components/schemas/JobKind'}}
        - name: state
          in: query
          description: 按任务状态精确筛选。使用 JobState 中的值，其他非空值返回空列表。
          schema: {type: string}
      responses:
        '200':
          description: 操作记录分页
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/Job'}
        '400': {$ref: '#/components/responses/Error'}
    post:
      operationId: startJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: {type: string, enum: [PARSE, PUBLISH, MATCH, METADATA]}
                paperIds:
                  type: array
                  description: 服务端将重复论文 ID 去重。
                  items: {type: string, minLength: 1, maxLength: 255}
                sourceId: {type: string}
                yearFrom: {type: integer, minimum: 1000, maximum: 9999}
                yearTo: {type: integer, minimum: 1000, maximum: 9999}
              description: 匹配、解析和全文导入接受非空的 paperIds 或一个出版来源，二选一。仅按出版来源处理时可提供年份范围。METADATA 使用来源和可选年份。
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /jobs/{jobId}:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      operationId: getJob
      responses:
        '200': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /jobs/{jobId}/items:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      operationId: listJobItems
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}]
      responses:
        '200':
          description: 操作对象的逐项结果
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/JobItem'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /jobs/{jobId}/retry:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      operationId: retryJob
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: PAPERFLOW_SESSION
  parameters:
    PaperId: {name: paperId, in: path, required: true, schema: {type: string}}
    JobId: {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
    Version: {name: version, in: query, required: true, schema: {type: integer, format: int64, minimum: 0}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
    Size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
  responses:
    Error:
      description: 统一错误响应
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: {type: string}
              message: {type: string}
    Session:
      description: 当前平台用户及可用权限。需要改密时 permissions 为空。
      content:
        application/json:
          schema:
            type: object
            required: [username, displayName, role, mustChangePassword, permissions]
            properties:
              username: {type: string}
              displayName: {type: string}
              role: {$ref: '#/components/schemas/UserRole'}
              mustChangePassword: {type: boolean}
              permissions:
                type: array
                items: {$ref: '#/components/schemas/Permission'}
    Paper:
      description: 论文信息
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Paper'}
    Job:
      description: 任务摘要
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Job'}
  schemas:
    UserRole:
      type: string
      enum: [SYSTEM_ADMIN, DATA_MAINTAINER, READ_ONLY]
      description: 系统管理员、数据维护员、只读用户
    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    UserProfile:
      type: object
      required: [displayName, role]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 100}
        role: {$ref: '#/components/schemas/UserRole'}
    PlatformUser:
      allOf:
        - {$ref: '#/components/schemas/UserProfile'}
        - type: object
          required: [username, status, createdAt]
          properties:
            username: {type: string}
            status: {$ref: '#/components/schemas/UserStatus'}
            createdAt: {type: string, format: date-time}
    Permission:
      type: string
      enum: [PAPER_READ, CONTENT_READ, PAPER_CSV_EXPORT, PAPER_WRITE, JOB_READ, PDF_PARSE, FULL_TEXT_IMPORT, OPENALEX_MANAGE, SYSTEM_MANAGE]
      description: |
        PAPER_READ 允许查阅论文书目、关联及出版来源。CONTENT_READ 允许读取原件、已发布全文及资源。
        PAPER_CSV_EXPORT 单独授权 CSV 下载。PAPER_WRITE 允许导入、编辑、替换、归档恢复及原件导入任务。
        JOB_READ 允许读任务。PDF_PARSE、FULL_TEXT_IMPORT 分别允许提交或重试相应任务。
        OPENALEX_MANAGE 允许元数据导入、匹配和候选复核。SYSTEM_MANAGE 允许管理用户及读取审计日志。
        系统管理员拥有全部权限。数据维护员拥有除 PAPER_CSV_EXPORT 和 SYSTEM_MANAGE 外的权限。
        只读用户拥有 PAPER_READ 和 CONTENT_READ。任务提交和重试基于任务类型校验执行及 JOB_READ 权限。
    Page:
      type: object
      required: [items, page, size, total]
      properties:
        items: {type: array}
        page: {type: integer}
        size: {type: integer}
        total: {type: integer, format: int64}
    AuditOutcome:
      type: string
      enum: [SUCCEEDED, FAILED, DENIED]
    AuditEvent:
      type: object
      required: [eventId, occurredAt, actor, action, objectType, objectId, outcome]
      properties:
        eventId: {type: integer, format: int64}
        occurredAt: {type: string, format: date-time}
        actor: {type: string}
        action: {type: string, description: 含 PAPER_CSV_EXPORT、USER_CREATE、USER_DISPLAY_NAME_CHANGE 和 USER_ROLE_CHANGE}
        objectType: {type: string, description: CSV 导出的对象类型为 PAPER_COLLECTION，用户变更的对象类型为 USER}
        objectId: {type: string, description: CSV 导出的对象 ID 为 papers，用户变更的对象 ID 为用户名}
        outcome: {$ref: '#/components/schemas/AuditOutcome'}
    Metadata:
      type: object
      required: [sourceId, year, title, authors]
      properties:
        sourceId: {type: string}
        year: {type: integer, minimum: 1000, maximum: 9999}
        title: {type: string, minLength: 1, maxLength: 2000}
        authors: {type: string, minLength: 1, maxLength: 2000, description: 有序作者名单，使用英文分号分隔}
        doi: {type: [string, 'null'], description: 规范化后最多 500 个字符}
        url: {type: [string, 'null'], description: 规范化后最多 2000 个字符的 HTTP 或 HTTPS 地址}
        provider: {type: [string, 'null'], description: 规范化后最多 255 个字符}
    PaperStatus:
      type: string
      enum: [UNPROCESSED, READY, PUBLISHED, FAILED, UNSUPPORTED]
    Paper:
      type: object
      required: [paperId, sourceId, sourceName, year, title, authors, doi, url, provider, originalName, originalType, originalSize, version, revision, status, archived, legacy, hasOriginal, matchedWorkId, latestParseId, publishedParseId, updatedAt]
      properties:
        sourceId: {type: [string, 'null']}
        year: {type: [integer, 'null']}
        title: {type: [string, 'null']}
        authors: {type: [string, 'null']}
        doi: {type: [string, 'null']}
        url: {type: [string, 'null']}
        provider: {type: [string, 'null']}
        paperId: {type: string}
        sourceName: {type: [string, 'null']}
        originalName: {type: [string, 'null']}
        originalType: {type: [string, 'null']}
        originalSize: {type: [integer, 'null'], format: int64}
        version: {type: integer, format: int64}
        revision: {type: integer, format: int64}
        archived: {type: boolean}
        legacy: {type: boolean}
        hasOriginal: {type: boolean, description: 论文列表检查是否登记路径。详情和写操作响应检查文件是否可读。}
        matchedWorkId: {type: [string, 'null']}
        latestParseId: {type: [string, 'null'], format: uuid}
        publishedParseId: {type: [string, 'null'], format: uuid}
        status: {$ref: '#/components/schemas/PaperStatus'}
        updatedAt: {type: [string, 'null'], format: date-time}
    Block:
      type: object
      required: [sequence, type, text, page, hasAsset, attributes]
      properties:
        sequence: {type: integer}
        type: {type: string}
        page: {type: integer}
        text: {type: [string, 'null']}
        hasAsset: {type: boolean}
        attributes: {type: object}
    JobKind:
      type: string
      enum: [ORIGINAL_IMPORT, PARSE, PUBLISH, METADATA, MATCH]
    JobState:
      type: string
      enum: [READY, QUEUED, RUNNING, SUCCEEDED, FAILED, PARTIAL]
    Job:
      type: object
      required: [jobId, kind, state, total, ready, queued, running, succeeded, skipped, failed, username, retryOf, createdAt, finishedAt, confirmedAt, scope]
      properties:
        jobId: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/JobKind'}
        state: {$ref: '#/components/schemas/JobState'}
        total: {type: integer}
        ready: {type: integer}
        queued: {type: integer}
        running: {type: integer}
        succeeded: {type: integer}
        skipped: {type: integer}
        failed: {type: integer}
        username: {type: string}
        retryOf: {type: [string, 'null'], format: uuid}
        createdAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        confirmedAt: {type: [string, 'null'], format: date-time}
        scope: {type: object, description: 来源范围、所选论文数量 selectedCount，或 ZIP 文件名 filename}
    JobItem:
      type: object
      required: [sequence, target, paperId, state, message, result]
      properties:
        sequence: {type: integer}
        target: {type: string}
        paperId: {type: [string, 'null']}
        state: {type: string, enum: [READY, QUEUED, RUNNING, SUCCEEDED, SKIPPED, FAILED]}
        message: {type: [string, 'null']}
        result: {type: [object, 'null']}
