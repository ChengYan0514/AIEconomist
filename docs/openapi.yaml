openapi: 3.1.0
info:
  title: AI Economist 管理 API
  version: 0.1.0
  description: |
    写请求需要 CSRF。先在同一会话中请求 GET /csrf，再将 token 送入 headerName 指定的请求头。
    此规则也适用于登录。保存登录响应更新的 PAPERFLOW_SESSION Cookie。
    受保护的请求在会话无效时可返回 401 AUTH_REQUIRED，CSRF 校验失败时返回 403 ACCESS_DENIED。
    业务请求按当前账号的权限授权，权限不足返回 403 ACCESS_DENIED。
    临时密码会话只允许获取 CSRF、检查会话、改密和退出，其他业务请求返回 403 PASSWORD_CHANGE_REQUIRED。
    应用错误使用统一的 Error 响应结构。异步执行结果另见任务项。
servers:
  - url: /api
security:
  - session: []
paths:
  /csrf:
    get:
      operationId: csrfToken
      security: []
      responses:
        '200':
          description: POST、PUT、PATCH、DELETE 请求使用返回的 headerName 和 token
          content:
            application/json:
              schema:
                type: object
                required: [headerName, token]
                properties:
                  headerName: {type: string}
                  token: {type: string}
  /session:
    get:
      operationId: currentSession
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Error'}
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    delete:
      operationId: logout
      responses:
        '204': {description: 会话已退出}
  /session/password:
    post:
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: {type: string, format: password}
                newPassword: {type: string, format: password, minLength: 12, description: UTF-8 编码长度最多 72 字节}
      responses:
        '204': {description: 密码已更新并撤销使用旧凭据建立的会话}
        '400': {$ref: '#/components/responses/Error'}
  /users:
    get:
      operationId: listUsers
      description: 需要 SYSTEM_MANAGE。搜索同时匹配用户名和显示名称，忽略大小写。用户名升序。
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
        - {name: role, in: query, schema: {$ref: '#/components/schemas/UserRole'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/UserStatus'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: 平台用户分页
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/PlatformUser'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      operationId: createUser
      description: 需要 SYSTEM_MANAGE。用户名去除首尾空白并转为小写，创建后保持固定。角色必须存在。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/UserProfile'}
                - type: object
                  required: [username]
                  properties:
                    username: {type: string, description: '规范化后符合 ^[a-z0-9_.-]{3,50}$'}
      responses:
        '201':
          description: 新用户及仅在本次响应中展示的临时密码
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuedPassword'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error', description: ROLE_NOT_FOUND}
        '409': {$ref: '#/components/responses/Error', description: USERNAME_TAKEN}
  /users/{username}:
    get:
      operationId: getUser
      description: 需要 SYSTEM_MANAGE。按用户名精确查找平台用户。
      parameters: [{$ref: '#/components/parameters/Username'}]
      responses:
        '200':
          description: 平台用户
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformUser'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error', description: USER_NOT_FOUND}
    patch:
      operationId: updateUser
      description: 需要 SYSTEM_MANAGE。提交显示名称及单个角色，后续请求立即采用新角色。
      parameters:
        - {name: username, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserProfile'}
      responses:
        '200':
          description: 已更新的平台用户
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformUser'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error', description: USER_NOT_FOUND 或 ROLE_NOT_FOUND}
        '409': {$ref: '#/components/responses/Error', description: LAST_SYSTEM_ADMIN}
  /users/{username}/status:
    parameters: [{$ref: '#/components/parameters/Username'}]
    put:
      operationId: setUserStatus
      description: 需要 SYSTEM_MANAGE。停用会撤销旧会话，恢复后需要重新登录。账号和任务历史保留。状态相同时保留原状态。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {$ref: '#/components/schemas/UserStatus'}
      responses:
        '200':
          description: 当前平台用户
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformUser'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error', description: LAST_SYSTEM_ADMIN}
  /users/{username}/reset-password:
    parameters: [{$ref: '#/components/parameters/Username'}]
    post:
      operationId: resetUserPassword
      description: 需要 SYSTEM_MANAGE。撤销旧会话和旧密码。账号启用后可用新临时密码登录并设置个人密码。
      responses:
        '200':
          description: 平台用户及仅在本次响应中展示的新临时密码
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuedPassword'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /roles:
    get:
      operationId: listRoles
      description: 需要 SYSTEM_MANAGE。返回内置及自定义角色和可授权的业务权限目录。
      responses:
        '200':
          description: 角色及分组权限
          content:
            application/json:
              schema:
                type: object
                required: [items, permissionGroups]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/RoleSummary'}}
                  permissionGroups: {type: array, items: {$ref: '#/components/schemas/PermissionGroup'}}
        '403': {$ref: '#/components/responses/Error'}
    post:
      operationId: createRole
      description: 需要 SYSTEM_MANAGE。新角色未分配给任何用户，名称忽略大小写后唯一。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoleProfile'}
      responses:
        '201':
          description: 自定义角色详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleDetail'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error', description: ROLE_NAME_TAKEN}
  /roles/{roleId}:
    parameters:
      - {name: roleId, in: path, required: true, schema: {$ref: '#/components/schemas/UserRole'}}
    get:
      operationId: getRole
      description: 需要 SYSTEM_MANAGE。成员包含停用账号。
      responses:
        '200':
          description: 角色说明、权限和已分配用户
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleDetail'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error', description: ROLE_NOT_FOUND}
    put:
      operationId: updateRole
      description: 需要 SYSTEM_MANAGE。更新自定义角色，对现有会话后续请求生效。已分配人数变化时应重新确认。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/RoleProfile'}
                - type: object
                  required: [expectedUserCount]
                  properties:
                    expectedUserCount: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: 已更新的自定义角色详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleDetail'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error', description: ROLE_NOT_FOUND}
        '409': {$ref: '#/components/responses/Error', description: BUILT_IN_ROLE、ROLE_NAME_TAKEN 或 ROLE_ASSIGNMENTS_CHANGED}
    delete:
      operationId: deleteRole
      description: 需要 SYSTEM_MANAGE。仅可删除未分配给任何用户的自定义角色。
      responses:
        '204': {description: 角色已删除}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error', description: ROLE_NOT_FOUND}
        '409': {$ref: '#/components/responses/Error', description: BUILT_IN_ROLE 或 ROLE_IN_USE}
  /journals:
    get:
      operationId: listJournals
      description: 需要 PAPER_READ。按出版来源聚合未归档论文统计，并附带全库期刊概览。
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: filter, in: query, schema: {$ref: '#/components/schemas/JournalFilterMode'}}
        - {name: sort, in: query, schema: {$ref: '#/components/schemas/JournalSort'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: 期刊目录分页与全库概览
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JournalDirectory'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /journals/{sourceId}:
    get:
      operationId: getJournal
      description: 需要 PAPER_READ。返回指定出版来源的统计摘要、本地已导入 OpenAlex 作品数以及按年份分布。
      parameters:
        - {name: sourceId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 期刊详情与年度分布
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JournalDetail'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error', description: JOURNAL_NOT_FOUND}
  /papers:
    get:
      operationId: listPapers
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: sourceId, in: query, schema: {type: string}}
        - {name: yearFrom, in: query, schema: {type: integer, minimum: 1000, maximum: 9999}}
        - {name: yearTo, in: query, schema: {type: integer, minimum: 1000, maximum: 9999}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/PaperStatus'}}
        - {name: archived, in: query, schema: {type: boolean, default: false}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: 论文分页，最近编辑在前
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/Paper'}
        '400': {$ref: '#/components/responses/Error'}
    post:
      operationId: uploadPaper
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - {$ref: '#/components/schemas/Metadata'}
                - type: object
                  required: [file]
                  properties: {file: {type: string, format: binary, description: PDF，单个原件上限 100 MiB}}
      responses:
        '201': {$ref: '#/components/responses/Paper'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
  /papers/export:
    parameters:
      - {name: q, in: query, schema: {type: string, maxLength: 200}}
      - {name: sourceId, in: query, schema: {type: string}}
      - {name: yearFrom, in: query, schema: {type: integer, minimum: 1000, maximum: 9999}}
      - {name: yearTo, in: query, schema: {type: integer, minimum: 1000, maximum: 9999}}
      - {name: status, in: query, schema: {$ref: '#/components/schemas/PaperStatus'}}
      - {name: archived, in: query, schema: {type: boolean, default: false}}
    get:
      operationId: exportPapers
      description: 需要 PAPER_CSV_EXPORT。服务器完成 CSV 写入和刷新后记录成功事件。已登录的无效请求和导出异常记录为失败，权限不足的请求记录为拒绝。
      responses:
        '200':
          description: 导出全部命中行的 UTF-8 CSV
          content:
            text/csv:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    head:
      operationId: getPaperExportHeaders
      description: 需要 PAPER_CSV_EXPORT。检查导出响应头。
      responses:
        '200': {description: CSV 响应头}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /system-status:
    get:
      operationId: checkSystemStatus
      description: >-
        仅系统管理员可用。每次请求先通过数据库重新校验会话与权限，再独立检查七项依赖。
        进入检查后，某项不可用时仍返回其余结果。若数据库不可用导致会话无法校验，请求失败，
        页面保留上次结果及检查时间，并提示刷新失败。响应禁止缓存。
      responses:
        '200':
          description: 依赖检查结果与允许展示的生效配置
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemStatus'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '500':
          description: 请求处理失败。会话校验阶段的故障由服务器返回错误信息。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/responses/Error/content/application~1json/schema'
                  - type: object
  /service-settings:
    get:
      operationId: getServiceSettings
      description: 需要 SYSTEM_MANAGE。读取当前生效的 MinerU、因果抽取引擎、对话大模型与嵌入模型配置（API Key 仅返回脱敏状态与掩码）。
      responses:
        '200': {description: 当前生效的服务配置, content: {application/json: {schema: {type: object}}}}
        '403': {$ref: '#/components/responses/Error'}
    put:
      operationId: updateServiceSettings
      description: 需要 SYSTEM_MANAGE。保存服务与模型配置并立即热生效，写入审计日志。API Key 留空表示保持原有密钥，传 clearApiKey=true 表示清除密钥以使用本地免密模型。
      requestBody:
        required: true
        content: {application/json: {schema: {type: object}}}
      responses:
        '200': {description: 更新后的生效配置, content: {application/json: {schema: {type: object}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /service-settings/test/mineru:
    post:
      operationId: testMineruConnection
      description: 需要 SYSTEM_MANAGE。使用传入地址（或当前生效配置）测试 MinerU `/v1/health` 连通性。
      requestBody:
        required: true
        content: {application/json: {schema: {type: object}}}
      responses:
        '200': {description: 探测结果, content: {application/json: {schema: {type: object}}}}
  /service-settings/test/causal-engine:
    post:
      operationId: testCausalEngineConnection
      description: 需要 SYSTEM_MANAGE。使用传入地址（或当前生效配置）测试因果抽取引擎 `/v1/health` 连通性。
      requestBody:
        required: true
        content: {application/json: {schema: {type: object}}}
      responses:
        '200': {description: 探测结果, content: {application/json: {schema: {type: object}}}}
  /service-settings/test/chat:
    post:
      operationId: testChatModelConnection
      description: 需要 SYSTEM_MANAGE。发送极简探活请求验证对话大模型连通性及思考模式控制参数兼容性。
      requestBody:
        required: true
        content: {application/json: {schema: {type: object}}}
      responses:
        '200': {description: 探测结果, content: {application/json: {schema: {type: object}}}}
  /service-settings/test/embedding:
    post:
      operationId: testEmbeddingModelConnection
      description: 需要 SYSTEM_MANAGE。发送单条文本嵌入请求验证嵌入模型连通性与向量维度。
      requestBody:
        required: true
        content: {application/json: {schema: {type: object}}}
      responses:
        '200': {description: 探测结果, content: {application/json: {schema: {type: object}}}}
                    required: [timestamp, status, error, path]
                    properties:
                      timestamp: {type: string, format: date-time}
                      status: {type: integer, const: 500}
                      error: {type: string}
                      path: {type: string}
  /audit-events:
    get:
      operationId: listAuditEvents
      description: 仅系统管理员可用。所有条件同时匹配，时间边界包含在内，结果按时间及事件 ID 倒序。以 JOB 和任务 ID 筛选可查任务提交、重试和逐项结果。
      parameters:
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: actor, in: query, schema: {type: string, maxLength: 50}}
        - {name: action, in: query, schema: {type: string, maxLength: 64}}
        - {name: objectType, in: query, schema: {type: string, maxLength: 64}}
        - {name: objectId, in: query, schema: {type: string, maxLength: 255}}
        - {name: outcome, in: query, schema: {$ref: '#/components/schemas/AuditOutcome'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: 审计事件分页，标识筛选采用精确匹配
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/AuditEvent'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /audit-events/{eventId}:
    get:
      operationId: getAuditEvent
      description: 仅系统管理员可用。
      parameters:
        - {name: eventId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: 审计事件详情
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/AuditEvent'}
                  - required: [summary]
                    properties:
                      summary:
                        type: object
                        description: >-
                          按动作提供有限摘要。任务提交及重试保留类型和项目计数，重试另含原任务 ID。
                          JOB_ITEM_CHECK 表示提交或预检时跳过或拒绝的任务项，JOB_EXECUTE 表示执行后保存的结果。
                          任务项摘要含类型、序号、实际任务项状态以及可用的论文 ID 和固定错误代码。
                          跳过的任务项拥有 SUCCEEDED 的任务审计结果和 SKIPPED 的任务项状态。跳过时无论文导入或发布成功事件。
                          通过任务执行的论文导入或发布摘要含任务 ID 及任务项序号。
                          论文编辑摘要可包含版本和变更字段名，版本、原件修订号、状态和作品 ID 可用于追溯相关操作。
                          CSV、用户和角色保留各自摘要。摘要不含凭据、文件路径、任务原始请求、论文正文或底层异常文本。
                        additionalProperties:
                          oneOf:
                            - {type: string}
                            - {type: integer}
                            - {type: boolean}
                            - {type: array, items: {type: string}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /papers/{paperId}:
    parameters: [{$ref: '#/components/parameters/PaperId'}]
    get:
      operationId: getPaper
      responses:
        '200': {$ref: '#/components/responses/Paper'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      operationId: editPaper
      description: 提交完整书目字段。省略可选书目字段会清除原值。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/Metadata'}
                - type: object
                  required: [version]
                  properties: {version: {type: integer, format: int64}}
      responses:
        '200': {$ref: '#/components/responses/Paper'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /papers/{paperId}/archive:
    parameters: [{$ref: '#/components/parameters/PaperId'}, {$ref: '#/components/parameters/Version'}]
    post:
      operationId: archivePaper
      responses:
        '200': {$ref: '#/components/responses/Paper'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      operationId: restorePaper
      responses:
        '200': {$ref: '#/components/responses/Paper'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /papers/{paperId}/file:
    parameters: [{$ref: '#/components/parameters/PaperId'}]
    get:
      operationId: originalFile
      responses:
        '200':
          description: PDF 在线预览，其余原件类型作为附件返回
          content:
            application/pdf:
              schema: {type: string, format: binary}
            application/octet-stream:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/Error'}
    put:
      operationId: replaceOriginal
      description: 需要 PAPER_WRITE。原件读取由 CONTENT_READ 单独授权。
      parameters: [{$ref: '#/components/parameters/Version'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: {file: {type: string, format: binary, description: PDF，单个原件上限 100 MiB}}
      responses:
        '200': {$ref: '#/components/responses/Paper'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
  /papers/{paperId}/blocks:
    parameters: [{$ref: '#/components/parameters/PaperId'}]
    get:
      operationId: listBlocks
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}]
      responses:
        '200':
          description: 当前已发布全文，块按文档顺序排列
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/Block'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /papers/{paperId}/jobs:
    parameters: [{$ref: '#/components/parameters/PaperId'}]
    get:
      operationId: listPaperJobRecords
      description: 需要 PAPER_READ 和 JOB_READ。按论文 ID 返回已有新版任务项，包含已归档或历史论文的记录。ZIP 行须已成功登记原件，或在预检或执行时找到该论文。仅有旧版处理状态的论文返回空分页。
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}]
      responses:
        '200':
          description: 此论文的处理记录。按任务提交时间和任务 ID 降序，同一任务内按任务项 sequence 升序。total 为此论文符合条件的任务项总数。
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/PaperJobRecord'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /papers/{paperId}/blocks/{sequence}/asset:
    parameters:
      - {$ref: '#/components/parameters/PaperId'}
      - {name: sequence, in: path, required: true, schema: {type: integer, minimum: 0}}
    get:
      operationId: blockAsset
      responses:
        '200':
          description: 当前全文块登记的图片
          content:
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
            image/gif:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /papers/{paperId}/match:
    parameters: [{$ref: '#/components/parameters/PaperId'}]
    post:
      operationId: confirmMatch
      description: 使用打开候选复核时读取的论文版本确认关联。服务端在关联事务内重新校验论文版本、当前候选与作品唯一性。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workId, version]
              properties:
                workId: {type: string}
                version: {type: integer, format: int64}
      responses:
        '200': {$ref: '#/components/responses/Paper'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409':
          $ref: '#/components/responses/Error'
          description: 论文版本或归档状态已变化，候选已变化，或作品已有论文关联。
  /sources:
    get:
      operationId: searchSources
      description: 需要 PAPER_READ、PDF_PARSE 或 FULL_TEXT_IMPORT 中的一项。
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
      responses:
        '200':
          description: 最多 25 个来自 OpenAlex 快照的出版来源
          content:
            application/json:
              schema:
                type: array
                maxItems: 25
                items:
                  type: object
                  required: [sourceId, name]
                  properties:
                    sourceId: {type: string}
                    name: {type: string}
        '400': {$ref: '#/components/responses/Error'}
  /imports:
    post:
      operationId: preflightOriginals
      description: 需要 PAPER_WRITE 和 JOB_READ。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: {file: {type: string, format: binary, description: ZIP，上限 256 MiB}}
      responses:
        '201': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
  /imports/{jobId}/confirm:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      operationId: confirmOriginals
      description: 需要 PAPER_WRITE 和 JOB_READ。将通过预检的任务项加入队列，执行时复核重复。重复确认返回同一任务的当前摘要。
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /jobs:
    get:
      operationId: listJobs
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {name: kind, in: query, schema: {$ref: '#/components/schemas/JobKind'}}
        - name: state
          in: query
          description: 按任务状态精确筛选。使用 JobState 中的值，其他非空值返回空列表。
          schema: {type: string}
      responses:
        '200':
          description: 操作记录分页
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/Job'}
        '400': {$ref: '#/components/responses/Error'}
    post:
      operationId: startJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: {type: string, enum: [PARSE, PUBLISH, MATCH, METADATA]}
                paperIds:
                  type: array
                  description: 服务端将重复论文 ID 去重。
                  items: {type: string, minLength: 1, maxLength: 255}
                sourceId: {type: string}
                yearFrom: {type: integer, minimum: 1000, maximum: 9999}
                yearTo: {type: integer, minimum: 1000, maximum: 9999}
              description: 匹配、解析和全文导入接受非空的 paperIds 或一个出版来源，二选一。仅按出版来源处理时可提供年份范围。METADATA 使用来源和可选年份。
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /jobs/{jobId}:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      operationId: getJob
      responses:
        '200': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /jobs/{jobId}/items:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      operationId: listJobItems
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - name: state
          in: query
          description: 按 JobItemState 中的状态精确筛选，省略或传空字符串时返回所有状态。其他非空值返回空列表。
          schema: {type: string}
      responses:
        '200':
          description: 按 sequence 排序的任务项。先筛选再分页，total 为符合筛选条件的任务项总数。任务摘要始终统计整个任务。
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/JobItem'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /jobs/{jobId}/retry:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      operationId: retryJob
      description: 重试原任务中所有符合条件的失败项。返回的新任务通过 retryOf 指向原任务。
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /causal/summary:
    get:
      operationId: causalSummary
      description: 需要 CAUSAL_READ。返回基于预聚合读模型的因果图谱全库统计、当前图谱中有数据的学科子领域（按关联关系数降序）、方法列表与数据集修订号。
      responses:
        '200': {description: 图谱总览摘要, content: {application/json: {schema: {$ref: '#/components/schemas/CausalGraphSummary'}}}}
        '403': {$ref: '#/components/responses/Error'}
  /causal/graph:
    get:
      operationId: causalGraph
      description: 需要 CAUSAL_READ。基于 v2_causal_edge_index 按变量、最小主张数、最小方法数与子领域筛选返回因果子图。
      parameters:
        - {name: minRecordCount, in: query, schema: {type: integer, minimum: 1}}
        - {name: minPaperCount, in: query, schema: {type: integer, minimum: 1}}
        - {name: minDiversity, in: query, schema: {type: integer, minimum: 1}}
        - {name: subfields, in: query, schema: {type: array, items: {type: string}}}
        - {name: q, in: query, schema: {type: string, maxLength: 255}}
        - {name: maxNodes, in: query, schema: {type: integer, minimum: 1, maximum: 1000}}
        - {name: maxEdges, in: query, schema: {type: integer, minimum: 1, maximum: 2000}}
      responses:
        '200': {description: 因果网络子图, content: {application/json: {schema: {$ref: '#/components/schemas/CausalGraphData'}}}}
        '403': {$ref: '#/components/responses/Error'}
  /causal/fields:
    get:
      operationId: causalFields
      description: 需要 CAUSAL_READ。返回领域分析（学科子领域×细分主题明细及高频关系/高频变量/方法分布洞察）。
      responses:
        '200': {description: 领域分析结果, content: {application/json: {schema: {$ref: '#/components/schemas/CausalFieldAnalysis'}}}}
        '403': {$ref: '#/components/responses/Error'}
  /causal/variables/{name}:
    get:
      operationId: causalVariableDetail
      description: 需要 CAUSAL_READ。返回因果变量详情、一跳出入边、学科子领域分布与发表年份分布。
      parameters: [{name: name, in: path, required: true, schema: {type: string, maxLength: 255}}]
      responses:
        '200': {description: 变量详情, content: {application/json: {schema: {type: object}}}}
        '404': {$ref: '#/components/responses/Error'}
  /causal/relations:
    get:
      operationId: causalRelationDetail
      description: 需要 CAUSAL_READ。按原因变量与结果变量查看因果关系方向分布、统计与原文证据。
      parameters:
        - {name: cause, in: query, required: true, schema: {type: string, maxLength: 255}}
        - {name: effect, in: query, required: true, schema: {type: string, maxLength: 255}}
      responses:
        '200': {description: 关系证据详情, content: {application/json: {schema: {type: object}}}}
        '404': {$ref: '#/components/responses/Error'}
  /causal/relations/{claimId}:
    get:
      operationId: causalRelationById
      description: 需要 CAUSAL_READ。按 claimId 查看因果关系详情与证据记录。
      parameters: [{name: claimId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '200': {description: 关系证据详情, content: {application/json: {schema: {type: object}}}}
        '404': {$ref: '#/components/responses/Error'}
  /causal/papers/{workId}:
    get:
      operationId: causalPaperDetail
      description: 需要 CAUSAL_READ。按 OpenAlex 作品 ID 查看论文因果主张与单篇子图，已关联本地论文时附带 paperId。
      parameters: [{name: workId, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: 论文因果主张详情, content: {application/json: {schema: {type: object}}}}
  /causal/papers/{workId}/summary:
    get:
      operationId: causalPaperSummary
      description: 需要 CAUSAL_READ。返回单篇 OpenAlex 作品的因果主张、关系与变量计数摘要。
      parameters: [{name: workId, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: 论文因果摘要, content: {application/json: {schema: {type: object}}}}
  /causal/papers/status/{paperId}:
    get:
      operationId: causalPaperStatus
      description: 需要 PAPER_READ。返回单篇论文维度的因果抽取状态（未抽取/抽取中/待审核/已抽取/无因果/失败及日志/前置未完成）。
      parameters: [{name: paperId, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: 论文因果状态详情, content: {application/json: {schema: {type: object}}}}
        '404': {$ref: '#/components/responses/Error'}
  /causal/overview-stats:
    get:
      operationId: causalOverviewStats
      description: 需要 PAPER_READ。返回论文因果抽取阶段二全局统计概况（成功抽取、未抽取、抽取失败）。
      parameters: [{name: sourceId, in: query, schema: {type: string}}]
      responses:
        '200': {description: 因果抽取统计概况, content: {application/json: {schema: {type: object}}}}
  /causal/search/variables:
    get:
      operationId: searchCausalVariables
      description: 需要 CAUSAL_READ。基于预聚合索引检索图谱因果变量，按前缀匹配优先及记录数降序返回，供自动补全与全局检索使用。
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, maxLength: 255}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50}}
      responses:
        '200': {description: 匹配变量列表, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /causal/search/terms:
    get:
      operationId: searchCausalTerms
      description: 需要 CAUSAL_READ。检索项目内置 STW 主题词表，未命中时回退至当前图谱已有变量名称。
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, maxLength: 255}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50}}
      responses:
        '200': {description: 词条列表, content: {application/json: {schema: {type: array, items: {type: string}}}}}
  /causal/search/papers:
    get:
      operationId: searchCausalPapers
      description: 需要 CAUSAL_READ。按作品 ID 或标题检索包含因果主张的论文。
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, maxLength: 255}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50}}
      responses:
        '200': {description: 论文检索结果, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /causal/read-model/refresh:
    post:
      operationId: refreshCausalReadModel
      description: 需要 SYSTEM_MANAGE 或 CAUSAL_EXTRACT。手动重建 v2_causal_edge_index 与 v2_causal_snapshot 读模型。
      responses:
        '200': {description: 刷新结果, content: {application/json: {schema: {type: object}}}}
        '403': {$ref: '#/components/responses/Error'}
  /causal/extractions/estimate:
    post:
      operationId: estimateCausalExtraction
      description: 需要 CAUSAL_EXTRACT。预估目标范围的可执行论文数、跳过原因、引擎配置版本与调用上限。
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CausalExtractionRequest'}}}
      responses:
        '200': {description: 预估结果, content: {application/json: {schema: {type: object}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /causal/extractions:
    get:
      operationId: listCausalBatches
      description: 需要 CAUSAL_READ。分页查询因果抽取批次。
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}]
      responses:
        '200': {description: 批次分页, content: {application/json: {schema: {$ref: '#/components/schemas/Page'}}}}
    post:
      operationId: createCausalBatch
      description: 需要 CAUSAL_EXTRACT。创建因果抽取批次并由事件驱动异步编排器提交至 causal-engine。
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CausalExtractionRequest'}}}
      responses:
        '202': {description: 批次已受理, content: {application/json: {schema: {type: object}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /causal/extractions/{batchId}:
    get:
      operationId: getCausalBatch
      description: 需要 CAUSAL_READ。查看批次详情及按状态筛选分页的单篇抽取记录。
      parameters:
        - {name: batchId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [QUEUED, RUNNING, PENDING_REVIEW, PUBLISHING, SUCCEEDED, SKIPPED, FAILED, CANCELLED]}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {description: 批次与单篇记录详情, content: {application/json: {schema: {type: object}}}}
        '404': {$ref: '#/components/responses/Error'}
  /causal/extractions/{batchId}/review:
    get:
      operationId: getCausalBatchReview
      description: 需要 CAUSAL_READ。获取批次中所有待审核（PENDING_REVIEW）论文的抽取草稿列表供人工审核。
      parameters: [{name: batchId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: 批次待审核列表, content: {application/json: {schema: {type: array, items: {type: object}}}}}
        '404': {$ref: '#/components/responses/Error'}
    post:
      operationId: submitCausalBatchReview
      description: 需要 CAUSAL_EXTRACT。提交批次中待审核论文的最终因果主张，审核通过并确定入库。
      parameters: [{name: batchId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {runs: {type: array, items: {type: object}}}}}}
      responses:
        '200': {description: 批次审核提交完成, content: {application/json: {schema: {type: object}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /causal/extractions/{batchId}/events:
    get:
      operationId: streamCausalBatchEvents
      description: 需要 CAUSAL_READ。建立 SSE 事件流实时推送该批次单篇阶段变化与完成通知。
      parameters: [{name: batchId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: text/event-stream 实时事件流, content: {text/event-stream: {schema: {type: string}}}}
        '404': {$ref: '#/components/responses/Error'}
  /causal/extractions/{batchId}/cancel:
    post:
      operationId: cancelCausalBatch
      description: 需要 CAUSAL_EXTRACT。取消批次内未发布项，已落库发布不受影响。
      parameters: [{name: batchId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: 批次已取消, content: {application/json: {schema: {type: object}}}}
        '409': {$ref: '#/components/responses/Error'}
  /causal/extractions/{batchId}/retry:
    post:
      operationId: retryCausalBatch
      description: 需要 CAUSAL_EXTRACT。在原批次内重试失败项，优先复用引擎检查点或直接幂等重投发布。
      parameters: [{name: batchId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '202': {description: 已重新调度重试, content: {application/json: {schema: {type: object}}}}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /causal/runs/{runId}/artifacts:
    get:
      operationId: listCausalRunArtifacts
      description: 需要 CAUSAL_EXTRACT。列出单篇运行可用的白名单阶段产物。
      parameters: [{name: runId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: 产物清单, content: {application/json: {schema: {type: array, items: {type: object}}}}}
        '404': {$ref: '#/components/responses/Error'}
  /causal/runs/{runId}/artifacts/{name}:
    get:
      operationId: downloadCausalRunArtifact
      description: 需要 CAUSAL_EXTRACT。受控代理下载白名单阶段产物文件。
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 产物文件流, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /causal/runs/{runId}/review:
    get:
      operationId: getCausalRunReview
      description: 需要 CAUSAL_READ。获取单篇待审核运行的抽取草稿。
      parameters: [{name: runId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: 单篇待审核草稿, content: {application/json: {schema: {type: object}}}}
        '404': {$ref: '#/components/responses/Error'}
    post:
      operationId: submitCausalRunReview
      description: 需要 CAUSAL_EXTRACT。提交单篇审核后的因果主张并确定入库。
      parameters: [{name: runId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {claims: {type: array, items: {type: object}}}}}}
      responses:
        '200': {description: 审核通过入库成功, content: {application/json: {schema: {type: object}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      operationId: dismissCausalRunReview
      description: 需要 CAUSAL_EXTRACT。放弃/取消单篇待审核运行，不入库。
      parameters: [{name: runId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: 已取消待审核, content: {application/json: {schema: {type: object}}}}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: PAPERFLOW_SESSION
  parameters:
    PaperId: {name: paperId, in: path, required: true, schema: {type: string}}
    JobId: {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
    Username: {name: username, in: path, required: true, schema: {type: string}}
    Version: {name: version, in: query, required: true, schema: {type: integer, format: int64, minimum: 0}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
    Size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
  headers:
    NoStore:
      schema: {type: string, const: no-store}
  responses:
    Error:
      description: 统一错误响应
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: {type: string}
              message: {type: string}
    Session:
      description: 当前平台用户及可用权限。需要改密时 permissions 为空。
      content:
        application/json:
          schema:
            type: object
            required: [username, displayName, role, mustChangePassword, permissions]
            properties:
              username: {type: string}
              displayName: {type: string}
              role: {$ref: '#/components/schemas/UserRole'}
              mustChangePassword: {type: boolean}
              permissions:
                type: array
                items: {$ref: '#/components/schemas/Permission'}
    Paper:
      description: 论文信息
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Paper'}
    Job:
      description: 任务摘要
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Job'}
  schemas:
    UserRole:
      type: string
      pattern: '^(SYSTEM_ADMIN|DATA_MAINTAINER|READ_ONLY|RESEARCHER|CUSTOM_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$'
      description: 平台用户唯一分配的角色 ID。内置角色为 SYSTEM_ADMIN、DATA_MAINTAINER、READ_ONLY、RESEARCHER。
    RoleProfile:
      type: object
      required: [name, description, permissions]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, maxLength: 500}
        permissions:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/BusinessPermission'}
    BusinessPermission:
      type: string
      enum: [PAPER_READ, CONTENT_READ, PAPER_CSV_EXPORT, PAPER_WRITE, JOB_READ, PDF_PARSE, FULL_TEXT_IMPORT, OPENALEX_MANAGE, CAUSAL_READ, CAUSAL_EXTRACT, CLIENT_ACCESS]
      description: |
        CONTENT_READ 和 PAPER_WRITE 依赖 PAPER_READ。PDF_PARSE 和 FULL_TEXT_IMPORT 依赖 JOB_READ。
        OPENALEX_MANAGE 依赖 PAPER_READ 及 JOB_READ。CAUSAL_EXTRACT 依赖 PAPER_READ 及 CAUSAL_READ。
        CLIENT_ACCESS 独立授权访问客户端科研工作台（/api/client/**）。
        ZIP 批量导入需要 PAPER_WRITE 和 JOB_READ。CSV 导出单独授权。
    RoleSummary:
      type: object
      required: [id, name, description, builtIn, userCount]
      properties:
        id: {$ref: '#/components/schemas/UserRole'}
        name: {type: string}
        description: {type: string}
        builtIn: {type: boolean}
        userCount: {type: integer, format: int64, minimum: 0, description: 含启用及停用用户}
    RoleDetail:
      allOf:
        - {$ref: '#/components/schemas/RoleSummary'}
        - type: object
          required: [permissions, members]
          properties:
            permissions: {type: array, items: {$ref: '#/components/schemas/Permission'}}
            members:
              type: array
              items:
                type: object
                required: [username, displayName, status]
                properties:
                  username: {type: string}
                  displayName: {type: string}
                  status: {$ref: '#/components/schemas/UserStatus'}
    PermissionGroup:
      type: object
      required: [label, permissions]
      properties:
        label: {type: string}
        permissions:
          type: array
          items:
            type: object
            required: [code, label, requires]
            properties:
              code: {$ref: '#/components/schemas/BusinessPermission'}
              label: {type: string}
              requires: {type: array, items: {$ref: '#/components/schemas/BusinessPermission'}}
    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    UserProfile:
      type: object
      required: [displayName, role]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 100}
        role: {$ref: '#/components/schemas/UserRole'}
    PlatformUser:
      allOf:
        - {$ref: '#/components/schemas/UserProfile'}
        - type: object
          required: [username, status, createdAt]
          properties:
            username: {type: string}
            status: {$ref: '#/components/schemas/UserStatus'}
            createdAt: {type: string, format: date-time}
    IssuedPassword:
      type: object
      required: [user, temporaryPassword]
      properties:
        user: {$ref: '#/components/schemas/PlatformUser'}
        temporaryPassword: {type: string, format: password, readOnly: true}
    Permission:
      type: string
      enum: [PAPER_READ, CONTENT_READ, PAPER_CSV_EXPORT, PAPER_WRITE, JOB_READ, PDF_PARSE, FULL_TEXT_IMPORT, OPENALEX_MANAGE, CAUSAL_READ, CAUSAL_EXTRACT, CLIENT_ACCESS, SYSTEM_MANAGE]
      description: |
        PAPER_READ 允许查阅论文书目、关联及出版来源。CONTENT_READ 允许读取原件、已发布全文及资源。
        PAPER_CSV_EXPORT 单独授权 CSV 下载。PAPER_WRITE 允许单篇导入、编辑、替换、归档恢复。ZIP 批量导入还需要 JOB_READ。
        JOB_READ 允许读任务。PDF_PARSE、FULL_TEXT_IMPORT 分别允许提交或重试相应任务。
        OPENALEX_MANAGE 允许元数据导入、匹配和候选复核。
        CAUSAL_READ 允许查阅因果图谱、领域分析、论文因果主张及因果抽取批次。CAUSAL_EXTRACT 允许发起、取消、重试因果抽取与下载产物。
        CLIENT_ACCESS 允许访问客户端科研工作台（/api/client/**，详见 docs/openapi-client.yaml）。
        SYSTEM_MANAGE 仅由内置系统管理员持有，用于管理用户和角色、查看系统状态及审计。
        系统管理员拥有全部权限。数据维护员拥有除 PAPER_CSV_EXPORT 和 SYSTEM_MANAGE 外的权限。
        只读用户拥有 PAPER_READ、CONTENT_READ、CAUSAL_READ 和 CLIENT_ACCESS。研究者仅拥有 CLIENT_ACCESS。任务提交和重试基于任务类型校验执行及 JOB_READ 权限。
    Page:
      type: object
      required: [items, page, size, total]
      properties:
        items: {type: array}
        page: {type: integer}
        size: {type: integer}
        total: {type: integer, format: int64}
    SystemStatus:
      type: object
      additionalProperties: false
      required: [checks, configuration]
      properties:
        checks:
          type: array
          minItems: 7
          maxItems: 7
          description: 每项依赖恰好返回一个结果。
          items: {$ref: '#/components/schemas/DependencyCheck'}
        configuration:
          type: object
          additionalProperties: false
          required: [version, maxOriginalBytes, maxZipBytes, maxJobTargets, causalEnabled, causalDefaultMode, causalMaxBatchTargets]
          properties:
            version: {type: string, description: 当前应用的构建版本}
            maxOriginalBytes: {type: integer, format: int64, minimum: 0}
            maxZipBytes: {type: integer, format: int64, minimum: 0}
            maxJobTargets: {type: integer, minimum: 1}
            causalEnabled: {type: boolean}
            causalDefaultMode: {type: string, enum: [RAW, STANDARDIZED]}
            causalMaxBatchTargets: {type: integer, minimum: 1}
    DependencyCheck:
      type: object
      additionalProperties: false
      required: [dependency, state, checkedAt, message]
      properties:
        dependency:
          type: string
          enum: [POSTGRESQL, MINERU, CURRENT_STORAGE, LEGACY_STORAGE, OPENALEX_SNAPSHOT, CAUSAL_DATABASE, CAUSAL_ENGINE]
        state: {type: string, enum: [HEALTHY, UNAVAILABLE, NOT_CHECKED]}
        checkedAt: {type: [string, 'null'], format: date-time, description: 取得结果的时间。未检查时为空。}
        message: {type: string, description: 固定的简短说明，不包含部署配置或底层异常文本。}
    AuditOutcome:
      type: string
      enum: [SUCCEEDED, FAILED, DENIED]
    AuditEvent:
      type: object
      required: [eventId, occurredAt, actor, action, objectType, objectId, outcome]
      properties:
        eventId: {type: integer, format: int64}
        occurredAt: {type: string, format: date-time}
        actor: {type: string}
        action:
          type: string
          description: >-
            含 PAPER_CSV_EXPORT、PAPER_IMPORT、PAPER_EDIT、PAPER_REPLACE、PAPER_ARCHIVE、PAPER_RESTORE、
            PAPER_PUBLISH、PAPER_MATCH_CONFIRM、JOB_PREFLIGHT、JOB_SUBMIT、JOB_RETRY、JOB_ITEM_CHECK、JOB_EXECUTE，
            以及用户、角色和权限事件。
        objectType: {type: string, description: 论文操作对象为 PAPER，任务对象为 JOB，CSV 导出对象为 PAPER_COLLECTION，用户和角色事件对象分别为 USER 和 ROLE。}
        objectId: {type: string, description: 对象标识可为论文 ID、任务 ID、用户名或角色 ID。CSV 导出及未能取得论文 ID 的导入使用 papers。}
        outcome: {$ref: '#/components/schemas/AuditOutcome'}
    Metadata:
      type: object
      required: [sourceId, year, title, authors]
      properties:
        sourceId: {type: string}
        year: {type: integer, minimum: 1000, maximum: 9999}
        title: {type: string, minLength: 1, maxLength: 2000}
        authors: {type: string, minLength: 1, maxLength: 2000, description: 有序作者名单，使用英文分号分隔}
        doi: {type: [string, 'null'], description: 规范化后最多 500 个字符}
        url: {type: [string, 'null'], description: 规范化后最多 2000 个字符的 HTTP 或 HTTPS 地址}
        provider: {type: [string, 'null'], description: 规范化后最多 255 个字符}
    JournalFilterMode:
      type: string
      enum: [ALL, HAS_FAILED, HAS_PENDING, ALL_PUBLISHED]
    JournalSort:
      type: string
      enum: [PAPERS_DESC, PUBLISHED_RATE_DESC, FAILED_DESC, PENDING_DESC, UPDATED_DESC, NAME_ASC]
    CorpusJournalOverview:
      type: object
      required: [totalJournals, totalPapers, publishedPapers, matchedPapers, failedPapers, yearMin, yearMax]
      properties:
        totalJournals: {type: integer, format: int64}
        totalPapers: {type: integer, format: int64}
        publishedPapers: {type: integer, format: int64}
        matchedPapers: {type: integer, format: int64}
        failedPapers: {type: integer, format: int64}
        yearMin: {type: [integer, 'null']}
        yearMax: {type: [integer, 'null']}
    JournalSummary:
      type: object
      required: [sourceId, name, totalPapers, archivedPapers, publishedCount, readyCount, unprocessedCount, failedCount, unsupportedCount, matchedCount, yearMin, yearMax, latestUpdatedAt]
      properties:
        sourceId: {type: string}
        name: {type: string}
        totalPapers: {type: integer, format: int64}
        archivedPapers: {type: integer, format: int64}
        publishedCount: {type: integer, format: int64}
        readyCount: {type: integer, format: int64}
        unprocessedCount: {type: integer, format: int64}
        failedCount: {type: integer, format: int64}
        unsupportedCount: {type: integer, format: int64}
        matchedCount: {type: integer, format: int64}
        yearMin: {type: [integer, 'null']}
        yearMax: {type: [integer, 'null']}
        latestUpdatedAt: {type: [string, 'null'], format: date-time}
    JournalDirectory:
      allOf:
        - {$ref: '#/components/schemas/Page'}
        - type: object
          required: [summary]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/JournalSummary'}
            summary: {$ref: '#/components/schemas/CorpusJournalOverview'}
    JournalYearStats:
      type: object
      required: [year, total, published, ready, unprocessed, failed, unsupported, matched]
      properties:
        year: {type: integer}
        total: {type: integer, format: int64}
        published: {type: integer, format: int64}
        ready: {type: integer, format: int64}
        unprocessed: {type: integer, format: int64}
        failed: {type: integer, format: int64}
        unsupported: {type: integer, format: int64}
        matched: {type: integer, format: int64}
    JournalDetail:
      type: object
      required: [journal, importedWorksCount, years]
      properties:
        journal: {$ref: '#/components/schemas/JournalSummary'}
        importedWorksCount: {type: integer, format: int64}
        years:
          type: array
          items: {$ref: '#/components/schemas/JournalYearStats'}
    PaperStatus:
      type: string
      enum: [UNPROCESSED, READY, PUBLISHED, FAILED, UNSUPPORTED]
    Paper:
      type: object
      required: [paperId, sourceId, sourceName, year, title, authors, doi, url, provider, originalName, originalType, originalSize, version, revision, status, archived, legacy, hasOriginal, matchedWorkId, latestParseId, publishedParseId, updatedAt]
      properties:
        sourceId: {type: [string, 'null']}
        year: {type: [integer, 'null']}
        title: {type: [string, 'null']}
        authors: {type: [string, 'null']}
        doi: {type: [string, 'null']}
        url: {type: [string, 'null']}
        provider: {type: [string, 'null']}
        paperId: {type: string}
        sourceName: {type: [string, 'null']}
        originalName: {type: [string, 'null']}
        originalType: {type: [string, 'null']}
        originalSize: {type: [integer, 'null'], format: int64}
        version: {type: integer, format: int64}
        revision: {type: integer, format: int64}
        archived: {type: boolean}
        legacy: {type: boolean}
        hasOriginal: {type: boolean, description: 论文列表检查是否登记路径。详情和写操作响应检查文件是否可读。}
        matchedWorkId: {type: [string, 'null']}
        latestParseId: {type: [string, 'null'], format: uuid}
        publishedParseId: {type: [string, 'null'], format: uuid}
        status: {$ref: '#/components/schemas/PaperStatus'}
        updatedAt: {type: [string, 'null'], format: date-time}
    Block:
      type: object
      required: [sequence, type, text, page, hasAsset, attributes]
      properties:
        sequence: {type: integer}
        type: {type: string}
        page: {type: integer}
        text: {type: [string, 'null']}
        hasAsset: {type: boolean}
        attributes: {type: object}
    JobKind:
      type: string
      enum: [ORIGINAL_IMPORT, PARSE, PUBLISH, METADATA, MATCH]
    JobState:
      type: string
      enum: [READY, QUEUED, RUNNING, SUCCEEDED, FAILED, PARTIAL]
    JobItemState:
      type: string
      enum: [READY, QUEUED, RUNNING, SUCCEEDED, SKIPPED, FAILED]
    PaperJobRecord:
      type: object
      required: [jobId, sequence, kind, state, message, createdAt]
      properties:
        jobId: {type: string, format: uuid}
        sequence: {type: integer}
        kind: {$ref: '#/components/schemas/JobKind'}
        state: {$ref: '#/components/schemas/JobItemState'}
        message: {type: [string, 'null']}
        createdAt: {type: string, format: date-time, description: 任务提交时间。}
    Job:
      type: object
      required: [jobId, kind, state, total, ready, queued, running, succeeded, skipped, failed, canRetry, username, retryOf, createdAt, finishedAt, confirmedAt, scope]
      properties:
        jobId: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/JobKind'}
        state: {$ref: '#/components/schemas/JobState'}
        total: {type: integer}
        ready: {type: integer}
        queued: {type: integer}
        running: {type: integer}
        succeeded: {type: integer}
        skipped: {type: integer}
        failed: {type: integer}
        canRetry: {type: boolean, description: 任务已完成且有可重试的失败项。调用者还需要任务对应的执行权限。}
        username: {type: string}
        retryOf: {type: [string, 'null'], format: uuid}
        createdAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        confirmedAt: {type: [string, 'null'], format: date-time}
        scope: {type: object, description: 来源范围、所选论文数量 selectedCount，或 ZIP 文件名 filename}
    JobItem:
      type: object
      required: [sequence, target, paperId, state, inputError, message, result, preflight]
      properties:
        sequence: {type: integer, description: ZIP 导入时为从 1 开始的 CSV 数据记录位序，不含表头。}
        target: {type: string}
        paperId: {type: [string, 'null'], description: 论文 ID。待导入的 ZIP 行可显示预计算 ID。若执行时发现已登记论文，则返回该论文的实际 ID。}
        state: {$ref: '#/components/schemas/JobItemState'}
        inputError: {type: boolean, description: 此项在 ZIP 预检阶段失败，需要修正后重新上传。}
        message: {type: [string, 'null']}
        result:
          type: [object, 'null']
          description: 随任务类型变化。匹配任务保存执行时的候选书目和出版来源。
          properties:
            paperId: {type: string, description: ZIP 导入登记或找到的实际论文 ID。}
            candidates:
              type: array
              items: {$ref: '#/components/schemas/MatchCandidate'}
            matched: {type: boolean}
            candidateSource:
              type: [object, 'null']
              description: 候选的出版来源。无候选时为空，旧匹配结果可以省略此字段。
              required: [sourceId, name]
              properties:
                sourceId: {type: string}
                name: {type: [string, 'null']}
        preflight:
          oneOf:
            - $ref: '#/components/schemas/OriginalPreflight'
            - type: 'null'
          description: ZIP 行的预检结果，执行后仍可读取。其他任务返回 null。
    MatchCandidate:
      type: object
      required: [workId, year, title, doi, authors]
      properties:
        workId: {type: string}
        year: {type: [integer, 'null']}
        title: {type: [string, 'null']}
        doi: {type: [string, 'null']}
        authors: {type: string}
    OriginalPreflight:
      type: object
      required: [status, originalPath, reason, existingPaperId]
      properties:
        status: {type: string, enum: [IMPORTABLE, DUPLICATE, ERROR]}
        originalPath: {type: [string, 'null'], description: CSV 中的包内原件路径。未填写路径或旧任务未记录路径时为空。}
        reason: {type: [string, 'null'], description: 预检发现重复或问题的原因。}
        existingPaperId: {type: [string, 'null'], description: 预检发现已登记的重复论文时返回其实际 ID。}
    CausalGraphSummary:
      type: object
      required: [overview, subfields, methods, version]
      properties:
        overview: {type: object}
        subfields: {type: array, items: {type: string}}
        methods: {type: array, items: {type: string}}
        version: {type: object}
    CausalGraphData:
      type: object
      required: [nodes, edges]
      properties:
        nodes: {type: array, items: {type: object}}
        edges: {type: array, items: {type: object}}
    CausalFieldAnalysis:
      type: object
      required: [items, insights]
      properties:
        items: {type: array, items: {type: object}}
        insights: {type: object}
    CausalExtractionRequest:
      type: object
      required: [target]
      properties:
        ingestionMode: {type: string, enum: [RAW, STANDARDIZED]}
        target:
          type: object
          required: [mode]
          properties:
            mode: {type: string, enum: [PAPER_IDS, WORK_IDS, SOURCE_IDS, FILTER]}
            paperIds: {type: array, items: {type: string}}
            workIds: {type: array, items: {type: string}}
            sourceIds: {type: array, items: {type: string}}
            filters: {type: object}
