name: paperflow-v2

services:
  mineru:
    image: nsfc-mineru-production:4.1.3-v2
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PAPERFLOW_MINERU_PORT:-18002}:8000"
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: ["mineru-kit"]
    command: ["api-server", "--host", "0.0.0.0", "--port", "8000", "--concurrency", "1"]
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${PAPERFLOW_MINERU_GPU:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/v1/health"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 6
