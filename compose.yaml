name: paperflow-v2

services:
  mineru:
    image: nsfc-mineru-production:4.1.3-v2
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PAPERFLOW_MINERU_PORT:-18002}:8000"
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: ["mineru-kit"]
    command: ["api-server", "--host", "0.0.0.0", "--port", "8000", "--concurrency", "1"]
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${PAPERFLOW_MINERU_GPU:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/v1/health"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 6

  causal-engine:
    build: ./causal-engine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${PAPERFLOW_CAUSAL_ENGINE_PORT:-18003}:18003"
    environment:
      CAUSAL_ENGINE_WORK_DIR: /data/causal-engine
      CAUSAL_PROFILE_VERSION: ${PAPERFLOW_CAUSAL_PROFILE_VERSION:-1}
      CAUSAL_MAX_CALLS: ${PAPERFLOW_CAUSAL_MAX_CALLS:-2000}
      CAUSAL_CHAT_BASE_URL: ${CAUSAL_CHAT_BASE_URL:-}
      CAUSAL_CHAT_MODEL: ${CAUSAL_CHAT_MODEL:-}
      CAUSAL_CHAT_API_KEY: ${CAUSAL_CHAT_API_KEY:-}
      CAUSAL_EMBEDDING_BASE_URL: ${CAUSAL_EMBEDDING_BASE_URL:-}
      CAUSAL_EMBEDDING_MODEL: ${CAUSAL_EMBEDDING_MODEL:-}
      CAUSAL_EMBEDDING_API_KEY: ${CAUSAL_EMBEDDING_API_KEY:-}
      CAUSAL_ENABLE_THINKING: ${CAUSAL_ENABLE_THINKING:-false}
      CAUSAL_THINKING_STYLE: ${CAUSAL_THINKING_STYLE:-AUTO}
    volumes:
      - ./var/causal-engine:/data/causal-engine
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18003/v1/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
